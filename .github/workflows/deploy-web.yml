name: Deploy Web

on:
  push:
    tags:
      - "v*"
    paths:
      - "apps/web/**"
      - "packages/**"

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Next.js to production
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 120s             # SSH connect timeout (default 30s — too tight under load)
          command_timeout: 30m      # full deploy can include npm install + Next.js build
          script: |
            cd /opt/tars
            bash infrastructure/scripts/deploy.sh web main
