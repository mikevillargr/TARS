; Four processes, one container: a display, a browser on it, a VNC server
; reading that display, and a websocket bridge so a browser can watch.
;
; Ordering matters. Xvfb has to exist before Chromium or x11vnc can attach to
; it, hence the priorities; supervisor has no dependency graph, so the launcher
; and x11vnc both retry rather than assume.

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
user=root

[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 %(ENV_BROWSER_WIDTH)sx%(ENV_BROWSER_HEIGHT)sx24 -nolisten tcp
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:chromium]
command=/usr/bin/python3 /opt/browser/launch.py
environment=DISPLAY=":99"
priority=20
startretries=20
autorestart=true
; Chromium flushes cookies to the profile on clean shutdown, so give it room.
; The default 10s escalation to SIGKILL can cost you a login you just did by
; hand. A hard `docker kill` still loses anything written since the last flush.
stopsignal=TERM
stopwaitsecs=25
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:cdp-forward]
; Chromium binds CDP to 127.0.0.1 only and ignores --remote-debugging-address.
; This republishes it on the container interface so the harness on the host can
; reach it. Still never public: compose binds the published port to loopback.
command=/usr/bin/socat TCP-LISTEN:9222,fork,reuseaddr TCP:127.0.0.1:9221
priority=25
startretries=30
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:x11vnc]
; -shared so the agent's own session and a human attaching over VNC can both be
; connected; -forever so the server survives a viewer disconnecting.
command=/usr/bin/x11vnc -display :99 -forever -shared -rfbport 5900 -nopw -quiet
priority=30
startretries=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:novnc]
command=/usr/bin/websockify --web=/usr/share/novnc 6080 localhost:5900
priority=40
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
