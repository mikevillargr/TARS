services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    environment:
      POSTGRES_USER: tars
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: tars
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tars_internal

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - tars_internal

  harness:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.harness
    restart: always
    env_file: ../../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://tars:${POSTGRES_PASSWORD}@postgres:5432/tars
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tars_internal
    expose:
      - "8000"

  web:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.web
    restart: always
    env_file: ../../.env
    environment:
      HARNESS_URL: http://harness:8000
    depends_on:
      - harness
    networks:
      - tars_internal
    expose:
      - "3000"

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - web
      - harness
    networks:
      - tars_internal

networks:
  tars_internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
