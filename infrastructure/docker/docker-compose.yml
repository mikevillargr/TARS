services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: tars
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: tars
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tars -d tars"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Optional locally: `docker compose up -d browser` then set
  # BROWSER_CDP_URL=http://127.0.0.1:9222. Without it the harness launches its
  # own headless Chromium in-process, so day-to-day dev needs no Docker.
  browser:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.browser
    restart: unless-stopped
    shm_size: 1gb   # Chromium crashes on heavy pages with Docker's 64MB default
    volumes:
      - browser_profile:/profile
    ports:
      - "127.0.0.1:9222:9222"   # CDP — loopback ONLY, it is unauthenticated
      - "127.0.0.1:6080:6080"   # noVNC — loopback ONLY, nginx gates it in prod
    environment:
      BROWSER_WIDTH: "1280"
      BROWSER_HEIGHT: "800"

volumes:
  postgres_data:
  redis_data:
  browser_profile:
