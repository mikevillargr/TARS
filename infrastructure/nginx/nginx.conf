user www-data;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 50M;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80 default_server;
        server_name tarsmv.duckdns.org;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl default_server;
        server_name tarsmv.duckdns.org;

        ssl_certificate /etc/letsencrypt/live/tarsmv.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/tarsmv.duckdns.org/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        # noVNC — interactive control of the browser container.
        #
        # This is the most dangerous route on the box: whoever reaches it drives
        # a real browser holding live client-portal logins. It is gated by the
        # auth_request below rather than by obscurity, and the upstream binds to
        # 127.0.0.1 so it is unreachable except through here.
        location /browser-vnc/ {
            auth_request /_vnc_auth;
            proxy_pass http://127.0.0.1:6080/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            # A VNC session is long-lived and mostly idle while you read a page;
            # the default 60s would drop it mid-login.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Validates the same httpOnly cookie the rest of the app uses, so VNC
        # access follows the normal session rather than inventing a second one.
        location = /_vnc_auth {
            internal;
            proxy_pass http://127.0.0.1:8000/api/browser/vnc-auth;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Cookie $http_cookie;
        }

        # Next.js auth routes — set httpOnly cookie
        location /api/auth/ {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Next.js proxy — reads httpOnly cookie, injects Bearer token for harness
        location /api/proxy/ {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            chunked_transfer_encoding on;
        }

        # Notification WebSocket — MUST be before generic /api/ block
        location /api/notifications/stream {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Browser observation WebSocket — MUST be before the /api/ block, which
        # sets `Connection ''` for SSE and so silently strips the upgrade. That
        # is why every WebSocket route here needs its own location.
        location ~ ^/api/browser/ws/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Agent job WebSocket streams — MUST be before /api/ block
        location ~ ^/api/agent-jobs/[^/]+/stream {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Harness API — direct (webhooks, health, OAuth callbacks)
        location /api/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            chunked_transfer_encoding on;
        }

        # Next.js static assets — served from host disk
        location /_next/static/ {
            alias /opt/tars/apps/web/.next/static/;
            expires 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Next.js public folder — serve at root path, fall through to Node if not found
        location / {
            root /opt/tars/apps/web/public;
            try_files $uri @nextjs;
            add_header Cache-Control "no-cache" always;
        }

        location @nextjs {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            add_header Cache-Control "no-cache" always;
        }
    }
}
